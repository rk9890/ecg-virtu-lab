# Simple workflow for deploying static content to GitHub Pages
name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build: # <--- 2 SPACES
    runs-on: ubuntu-latest # <--- 4 SPACES
    steps: # <--- 4 SPACES
      - name: Checkout # <--- 6 SPACES
        uses: actions/checkout@v4 # <--- 8 SPACES

      # ... (This is where the error is likely on the next few steps)

      - name: Set up Node.js # <--- 6 SPACES
        uses: actions/setup-node@v4 # <--- 8 SPACES
        with: # <--- 8 SPACES
          node-version: '20' # <--- 10 SPACES

      - name: Install dependencies # <--- 6 SPACES
        run: npm ci # <--- 8 SPACES

      - name: Build project # <--- 6 SPACES
        run: npm run build # <--- 8 SPACES

      # ... rest of the file
      
      # Step 4: Configure GitHub Pages deployment path
     - name: Setup Pages
  uses: actions/configure-pages@v5
  with:
    # Tell GitHub that your final static files are in the 'dist' directory
    static_site_generator: custom

      # Step 5: Upload the built files as an artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' 

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
