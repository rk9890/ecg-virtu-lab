# Simple workflow for deploying static content to GitHub Pages
name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # Step 1: Set up Node.js (needed to run npm/yarn)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
      
      # Step 2: Install dependencies
      - name: Install dependencies
        run: npm ci
      
      # Step 3: Build the Vite project (creates the /dist folder)
      - name: Build project
        run: npm run build
      
      # Step 4: Configure GitHub Pages deployment path
     - name: Setup Pages
  uses: actions/configure-pages@v5
  with:
    # Tell GitHub that your final static files are in the 'dist' directory
    static_site_generator: custom

      # Step 5: Upload the built files as an artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' 

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
